name: CD

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Build and upload binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.13.2

      - name: Test
        run: go test -race -count=1 -timeout=5m ./...

      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: go build -o dist/ratelimiter_linux_amd64 ./cmd/ratelimiter

      - name: Upload binary to release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/ratelimiter_linux_amd64
          fail_on_unmatched_files: true
