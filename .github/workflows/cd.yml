name: CD

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  BINARY_NAME: ratelimiter
  MAIN_PACKAGE: ./cmd/ratelimiter
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test
        run: go test -race -count=1 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        id: build
        run: |
          output="dist/${BINARY_NAME}_${RELEASE_TAG}_${GOOS}_${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            output="${output}.exe"
          fi
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "${output}" "${MAIN_PACKAGE}"
          echo "output=${output}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.output }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          checksums="${BINARY_NAME}_${RELEASE_TAG}_checksums.txt"
          sha256sum -- * > "${RUNNER_TEMP}/${checksums}"
          mv "${RUNNER_TEMP}/${checksums}" .
          cat "${checksums}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true

      - name: Summarize
        env:
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          {
            echo "## Release ${RELEASE_TAG}"
            echo
            echo "Assets attached to ${RELEASE_URL}:"
            echo
            echo '```'
            ls -1 dist
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
