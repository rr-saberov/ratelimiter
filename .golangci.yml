version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
  exclusions:
    presets:
      - comments

formatters:
  enable:
    - gofmt
    - goimports
